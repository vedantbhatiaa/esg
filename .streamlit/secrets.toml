# .streamlit/secrets.toml  —  TIP ESG Platform
# ===============================================
# This file is git-ignored. Never commit real values.
# Collaborators create their own copy from .env.example.
#
# Streamlit Cloud: paste into App Settings → Secrets
# Azure:           use Key Vault + environment variables

# ── LLM provider (chatbot) ───────────────────────────────────────────────────
# Options: "ollama" (local), "huggingface" (free cloud), "azure" (enterprise)
LLM_PROVIDER  = "ollama"
OLLAMA_MODEL  = "phi3"
# OLLAMA_URL  = "http://localhost:11434"   # override if Ollama runs elsewhere

# ── HuggingFace (free cloud, no GPU) ─────────────────────────────────────────
# HF_API_TOKEN = "hf_xxxxxxxxxxxxxxxxxxxx"
# HF_MODEL     = "mistralai/Mistral-7B-Instruct-v0.3"

# ── Azure OpenAI (AI insights / enterprise chatbot) ──────────────────────────
# AZURE_OPENAI_ENDPOINT   = "https://YOUR-RESOURCE.openai.azure.com"
# AZURE_OPENAI_KEY        = "your-key-here"
# AZURE_OPENAI_DEPLOYMENT = "gpt-4o"

# ── Azure AD (SharePoint / OneDrive storage backend) ─────────────────────────
# AZURE_CLIENT_ID     = "your-app-client-id"
# AZURE_CLIENT_SECRET = "your-app-client-secret"
# AZURE_TENANT_ID     = "your-tenant-id"
# SHAREPOINT_SITE     = "consultdss.sharepoint.com:/sites/TIP-ESG"
# SHAREPOINT_DRIVE    = "TIP-ESG-Data"

# ── Data configuration ────────────────────────────────────────────────────────
# DATA_YEAR_START  = 2009
# DATA_YEAR_END    = 2023
# MASTER_CSV_NAME  = "ESG_MASTER_WIDE_ALL_COMPANIES_2009_2023.csv"

# ── Authentication ────────────────────────────────────────────────────────────
# DSS_EMAIL_DOMAIN = "@consultdss.com"
# Production: supply client map as JSON to keep emails out of source code
# CLIENTS_JSON = '{"client@company.com": "Company Name"}'

# ── Tuning ────────────────────────────────────────────────────────────────────
# OLLAMA_NUM_PREDICT  = 500
# OLLAMA_NUM_CTX      = 2048
# LOG_RETENTION_DAYS  = 8
# FILELOCK_TIMEOUT    = 10